services:
  db:
    image: rajeshrayudu2022/library-app:database
    ports:
      - "3306:3306"
    volumes:
      - mydata:/mydata
    networks:
      - myapp
    deploy:
      replicas: 1
      resources:
        reservations:
          cpus: "0.25"
          memory: 200M
        limits:
          cpus: "0.5"
          memory: 4000M

  auth_service:
    image: rajeshrayudu2022/library-app:auth-service
    ports:
      - "5001:5001"
    networks:
      - myapp
    deploy:
      replicas: 2
      resources:
        reservations:
          cpus: "0.25"
          memory: 200M
        limits:
          cpus: "0.5"
          memory: 4000M

  book_service:
    image: rajeshrayudu2022/library-app:book-service
    ports:
      - "5002:5002"
    networks:
      - myapp
    deploy:
      replicas: 2
      resources:
        reservations:
          cpus: "0.25"
          memory: 200M
        limits:
          cpus: "0.5"
          memory: 4000M

  borrow_service:
    image: rajeshrayudu2022/library-app:borrow-service
    ports:
      - "5003:5003"
    networks:
      - myapp
    deploy:
      replicas: 2
      resources:
        reservations:
          cpus: "0.25"
          memory: 200M
        limits:
          cpus: "0.5"
          memory: 4000M

  frontend:
    image: rajeshrayudu2022/library-app:frontend
    ports:
      - "5000:5000"
    networks:
      - myapp
    deploy:
      replicas: 2
      resources:
        reservations:
          cpus: "0.25"
          memory: 200M
        limits:
          cpus: "0.5"
          memory: 4000M

volumes:
  mydata:

networks:
  myapp:
    driver: overlay
